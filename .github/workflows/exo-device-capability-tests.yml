name: EXO device capability unit tests
on:
  pull_request:
    paths:
      - 'core/device_capability_contract.py'
      - 'core/device_capability_dispatch.py'
      - 'core/home_edge/bitwarden_device_provider.py'
      - 'core/home_edge/device_http_adapter.py'
      - 'tests/test_device_capability_contract.py'
      - 'tests/test_device_capability_dispatch.py'
      - 'tests/test_home_edge_bitwarden_device_provider.py'
      - 'tests/test_home_edge_device_http_adapter.py'
      - '.github/workflows/exo-device-capability-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Run device capability tests
        run: python -m pytest -q tests/test_device_capability_contract.py tests/test_device_capability_dispatch.py tests/test_home_edge_bitwarden_device_provider.py tests/test_home_edge_device_http_adapter.py
