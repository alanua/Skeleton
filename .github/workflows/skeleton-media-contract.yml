name: Skeleton Media contract

on:
  pull_request:
    paths:
      - "core/skeleton_media_bridge.py"
      - "core/runner_five_layer_memory_activation.py"
      - "scripts/runner_poll_github_tasks.py"
      - "PROJECT_TREE.yaml"
      - "projects/skeleton_media/**"
      - "tests/test_skeleton_media_bridge.py"
      - ".github/workflows/skeleton-media-contract.yml"
  push:
    branches: [main]
    paths:
      - "core/skeleton_media_bridge.py"
      - "core/runner_five_layer_memory_activation.py"
      - "scripts/runner_poll_github_tasks.py"
      - "PROJECT_TREE.yaml"
      - "projects/skeleton_media/**"
      - "tests/test_skeleton_media_bridge.py"
      - ".github/workflows/skeleton-media-contract.yml"
  workflow_dispatch:

jobs:
  external-contract:
    runs-on: ubuntu-latest
    env:
      SKELETON_MEDIA_SHA: 7089b1ba37292aab0283cadb8ac85644cc3d28f8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch exact Skeleton Media revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/alanua/skeleton-media.git "$RUNNER_TEMP/skeleton-media"
          git -C "$RUNNER_TEMP/skeleton-media" checkout --detach "$SKELETON_MEDIA_SHA"
          test "$(git -C "$RUNNER_TEMP/skeleton-media" rev-parse HEAD)" = "$SKELETON_MEDIA_SHA"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "$RUNNER_TEMP/skeleton-media[dev]"

      - name: Verify external media bridge
        env:
          PYTHONPATH: ${{ runner.temp }}/skeleton-media:${{ github.workspace }}
        run: |
          python -m pytest -q tests/test_skeleton_media_bridge.py
          python -m pytest -q tests/test_runner_poll_github_tasks.py -k 'home_edge_debian_media_bootstrap or home_edge_media_source_snapshot or skeleton_media_repository_route'
          python - <<'PY'
          from core import skeleton_media_bridge as bridge
          assert bridge.SKELETON_MEDIA_REQUIRED_SHA == "7089b1ba37292aab0283cadb8ac85644cc3d28f8"
          assert bridge.dependency_source("home_edge.debian_media_bootstrap") == "external"
          assert bridge.dependency_source("home_edge.media_source_snapshot") == "external"
          assert bridge.load_media_module("home_edge.debian_media_bootstrap").__name__ == "skeleton_media.home_edge.debian_media_bootstrap"
          assert bridge.load_media_module("home_edge.media_source_snapshot").__name__ == "skeleton_media.home_edge.media_source_snapshot"
          from core import runner_five_layer_memory_activation as activation
          installer = bridge.load_media_module("video_understanding.runtime_install").install_runtime
          assert installer.__module__ == "skeleton_media.video_understanding.runtime_install"
          PY
