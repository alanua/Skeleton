name: Codex Runtime Recovery Bootstrap

"on":
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: codex-runtime-recovery-bootstrap
  cancel-in-progress: false

jobs:
  recover-codex:
    name: Recover pinned Codex runtime
    if: >-
      github.repository == 'alanua/Skeleton' &&
      github.event.issue.number == 2257 &&
      github.event.issue.state == 'open' &&
      github.event.label.name == 'queue:RUN_NOW' &&
      github.event.issue.user.login == 'alanua' &&
      contains(github.event.issue.body, 'Authorization Marker: EXPLICIT_REPAIR_AUTONOMOUS_CODE_EXECUTOR_20260808')
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 12
    env:
      TARGET_CODEX_VERSION: "0.144.4"
    steps:
      - name: Upgrade and verify Codex without touching repository state
        shell: bash
        run: |
          set -euo pipefail

          status=BLOCKED
          mutation_attempted=false
          mutation_applied=false
          rollback_status=not_needed
          smoke_status=not_run
          old_version=unknown
          new_version=unknown

          write_summary() {
            {
              echo "status=${status}"
              echo "mutation_attempted=${mutation_attempted}"
              echo "mutation_applied=${mutation_applied}"
              echo "rollback_status=${rollback_status}"
              echo "smoke_status=${smoke_status}"
              echo "old_version=${old_version}"
              echo "new_version=${new_version}"
            } >> "${GITHUB_STEP_SUMMARY}"
          }
          trap write_summary EXIT

          command -v npm >/dev/null
          codex_path="$(command -v codex)"
          test -n "${codex_path}"

          npm_prefix="$(npm prefix -g)"
          test -n "${npm_prefix}"
          expected_codex_path="${npm_prefix%/}/bin/codex"
          test "${codex_path}" = "${expected_codex_path}"

          old_version="$(codex --version | sed -nE 's/^codex-cli ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')"
          test -n "${old_version}"
          new_version="${old_version}"

          recovery_dir="$(mktemp -d "${RUNNER_TEMP}/codex-recovery.XXXXXX")"
          cleanup() {
            rm -rf "${recovery_dir}"
          }
          trap 'cleanup; write_summary' EXIT

          rollback_to_old() {
            rollback_status=attempted
            set +e
            npm install -g "@openai/codex@${old_version}" --no-audit --no-fund \
              >"${recovery_dir}/rollback.stdout" 2>"${recovery_dir}/rollback.stderr"
            rollback_rc=$?
            set -e
            if test "${rollback_rc}" -ne 0; then
              rollback_status=failed
              return 1
            fi
            restored_version="$(codex --version 2>/dev/null | sed -nE 's/^codex-cli ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' || true)"
            if test "${restored_version}" != "${old_version}"; then
              rollback_status=failed
              return 1
            fi
            rollback_status=restored
            new_version="${restored_version}"
            return 0
          }

          if test "${old_version}" != "${TARGET_CODEX_VERSION}"; then
            mutation_attempted=true
            set +e
            npm install -g "@openai/codex@${TARGET_CODEX_VERSION}" --no-audit --no-fund \
              >"${recovery_dir}/install.stdout" 2>"${recovery_dir}/install.stderr"
            install_rc=$?
            set -e

            if test "${install_rc}" -ne 0; then
              rollback_to_old || true
              exit 1
            fi

            mutation_applied=true
            new_version="$(codex --version 2>/dev/null | sed -nE 's/^codex-cli ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' || true)"
            if test "${new_version}" != "${TARGET_CODEX_VERSION}"; then
              rollback_to_old || true
              exit 1
            fi
          fi

          smoke_dir="${recovery_dir}/smoke"
          mkdir -m 700 "${smoke_dir}"

          set +e
          timeout 120 codex exec \
            --sandbox read-only \
            --model gpt-5.5 \
            --cd "${smoke_dir}" \
            "Return exactly RESULT: OK. Do not modify files." \
            >"${recovery_dir}/smoke.stdout" 2>"${recovery_dir}/smoke.stderr"
          smoke_rc=$?
          set -e

          if test "${smoke_rc}" -eq 0 && grep -Fxq "RESULT: OK" "${recovery_dir}/smoke.stdout"; then
            smoke_status=pass
            status=DONE
            exit 0
          fi

          smoke_status=failed
          if test "${mutation_attempted}" = true; then
            rollback_to_old || true
          fi
          exit 1
