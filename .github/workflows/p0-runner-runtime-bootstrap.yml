name: P0 Runner Runtime Bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-runner-runtime-bootstrap.yml

permissions:
  contents: read

concurrency:
  group: p0-runner-runtime-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-runner:
    if: github.repository == 'alanua/Skeleton'
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 10
    env:
      CANONICAL_REPOSITORY: alanua/Skeleton
      REQUIRED_ANCESTOR_SHA: d190516e4678ed4c74756655366ed8bed6dd7807
      TARGET_CHECKOUT: /home/agent/agent-dev/repos/Skeleton
      RUNNER_SERVICE: skeleton-runner-poll.service
      RUNNER_TIMER: skeleton-runner-poll.timer
    steps:
      - name: Replace legacy loop with canonical oneshot timer
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REPOSITORY}" = "${CANONICAL_REPOSITORY}"
          test "${TARGET_CHECKOUT}" = "/home/agent/agent-dev/repos/Skeleton"
          test -d "${TARGET_CHECKOUT}/.git"

          origin_url="$(git -C "${TARGET_CHECKOUT}" remote get-url origin)"
          case "${origin_url}" in
            https://github.com/alanua/Skeleton|https://github.com/alanua/Skeleton.git) ;;
            *) exit 1 ;;
          esac

          git -C "${TARGET_CHECKOUT}" fetch --quiet origin main
          origin_main_sha="$(git -C "${TARGET_CHECKOUT}" rev-parse origin/main)"
          test "${origin_main_sha}" = "${GITHUB_SHA}"
          git -C "${TARGET_CHECKOUT}" merge-base --is-ancestor \
            "${REQUIRED_ANCESTOR_SHA}" "${origin_main_sha}"

          current_branch="$(git -C "${TARGET_CHECKOUT}" rev-parse --abbrev-ref HEAD)"
          test "${current_branch}" = "main"
          test -z "$(git -C "${TARGET_CHECKOUT}" status --porcelain --untracked-files=all)"
          git -C "${TARGET_CHECKOUT}" merge --ff-only "${origin_main_sha}" >/dev/null
          test "$(git -C "${TARGET_CHECKOUT}" rev-parse HEAD)" = "${origin_main_sha}"
          test -z "$(git -C "${TARGET_CHECKOUT}" status --porcelain --untracked-files=all)"
          test -f "${TARGET_CHECKOUT}/scripts/runner_poll_github_tasks.py"

          runtime_dir="${HOME}/.local/state/skeleton-runner"
          unit_dir="${HOME}/.config/systemd/user"
          install -d -m 700 "${runtime_dir}" "${unit_dir}"

          service_tmp="$(mktemp "${RUNNER_TEMP}/skeleton-runner-service.XXXXXX")"
          timer_tmp="$(mktemp "${RUNNER_TEMP}/skeleton-runner-timer.XXXXXX")"
          trap 'rm -f "${service_tmp}" "${timer_tmp}"' EXIT

          cat >"${service_tmp}" <<'EOF'
          [Unit]
          Description=Skeleton GitHub task queue poll (canonical oneshot)
          After=network-online.target

          [Service]
          Type=oneshot
          WorkingDirectory=/home/agent/agent-dev/repos/Skeleton
          Environment=SKELETON_RUNNER_MODE=enforce
          Environment=SKELETON_RUNNER_BRANCH=main
          Environment=PATH=/home/agent/.local/bin:/usr/local/bin:/usr/bin:/bin
          ExecStart=/usr/bin/flock -n /home/agent/.local/state/skeleton-runner/poll.lock /usr/bin/python3 /home/agent/agent-dev/repos/Skeleton/scripts/runner_poll_github_tasks.py --workdir /home/agent/agent-dev/repos/Skeleton
          Nice=5
          EOF

          cat >"${timer_tmp}" <<'EOF'
          [Unit]
          Description=Skeleton GitHub task queue timer

          [Timer]
          OnBootSec=20s
          OnUnitInactiveSec=30s
          AccuracySec=5s
          Persistent=true
          Unit=skeleton-runner-poll.service

          [Install]
          WantedBy=timers.target
          EOF

          install -m 600 "${service_tmp}" "${unit_dir}/${RUNNER_SERVICE}"
          install -m 600 "${timer_tmp}" "${unit_dir}/${RUNNER_TIMER}"
          systemctl --user daemon-reload
          systemctl --user enable "${RUNNER_TIMER}" >/dev/null
          systemctl --user start "${RUNNER_TIMER}"
          systemctl --user is-enabled --quiet "${RUNNER_TIMER}"
          systemctl --user is-active --quiet "${RUNNER_TIMER}"

          mapfile -t legacy_pids < <(pgrep -f 'runner_poll_github_tasks[.]py[[:space:]]+--loop' || true)
          if (( ${#legacy_pids[@]} > 1 )); then
            echo "legacy_loop_count=${#legacy_pids[@]}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if (( ${#legacy_pids[@]} == 1 )); then
            kill -TERM "${legacy_pids[0]}"
            for _attempt in $(seq 1 20); do
              if ! kill -0 "${legacy_pids[0]}" 2>/dev/null; then
                break
              fi
              sleep 0.5
            done
            if kill -0 "${legacy_pids[0]}" 2>/dev/null; then
              exit 1
            fi
          fi

          systemctl --user start "${RUNNER_SERVICE}"
          systemctl --user is-active --quiet "${RUNNER_TIMER}"
          test -z "$(pgrep -f 'runner_poll_github_tasks[.]py[[:space:]]+--loop' || true)"

          {
            echo "bootstrap_status=DONE"
            echo "canonical_mode=systemd_user_oneshot_timer"
            echo "legacy_loop_count_after=0"
            echo "timer_enabled=true"
            echo "timer_active=true"
            echo "checkout_head=${origin_main_sha}"
          } >> "${GITHUB_STEP_SUMMARY}"
