name: Temporary Canonical Memory Root Patch

"on":
  pull_request:
    branches:
      - main
    paths:
      - core/private_memory_root_resolver.py
      - core/runner_five_layer_memory_activation.py
      - tests/test_private_memory_root_resolver.py
      - tests/test_runner_five_layer_memory_activation.py

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 1950 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct/derive-memory-root-from-canonical-config-20260725
          fetch-depth: 0
      - name: Connect activation executor to canonical root resolver
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/runner_five_layer_memory_activation.py")
          text = path.read_text(encoding="utf-8")
          if "resolve_private_memory_root(os.environ" in text:
              raise SystemExit(0)

          old_import = "from typing import Callable, Mapping\n\nTASK_ID"
          new_import = """from typing import Callable, Mapping

from core.private_memory_root_resolver import (
    PrivateMemoryRootResolutionError,
    resolve_private_memory_root,
)

TASK_ID"""
          old_root = """    private_root = os.environ.get("SKELETON_RUNNER_PRIVATE_MEMORY_ROOT", "").strip()
    if not private_root:
        return maintenance_report(
            "BLOCKED",
            TASK_ID,
            ["reason=private_memory_root_unavailable"],
            "not_met",
        )
"""
          new_root = """    try:
        private_root, _root_source = resolve_private_memory_root(
            os.environ,
            checkout=checkout,
        )
    except PrivateMemoryRootResolutionError as exc:
        return maintenance_report(
            "BLOCKED",
            TASK_ID,
            [f"reason={exc.reason_code}"],
            "not_met",
        )
"""
          counts = {
              "import": text.count(old_import),
              "root": text.count(old_root),
          }
          if counts != {"import": 1, "root": 1}:
              raise SystemExit(f"anchor counts={counts}")
          text = text.replace(old_import, new_import)
          text = text.replace(old_root, new_root)
          path.write_text(text, encoding="utf-8")
          PY
          if git diff --quiet -- core/runner_five_layer_memory_activation.py; then
            exit 0
          fi
          test "$(git diff --name-only)" = "core/runner_five_layer_memory_activation.py"
          git diff --check
          python3 -m py_compile \
            core/private_memory_root_resolver.py \
            core/runner_five_layer_memory_activation.py
          python3 -m pytest -q \
            tests/test_private_memory_root_resolver.py \
            tests/test_runner_five_layer_memory_activation.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/runner_five_layer_memory_activation.py
          git commit -m "Derive activation root from canonical private-memory config"
          git push origin HEAD:direct/derive-memory-root-from-canonical-config-20260725
