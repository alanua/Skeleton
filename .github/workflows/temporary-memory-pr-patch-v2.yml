name: Temporary Protected Runner Memory Route Patch

"on":
  pull_request:
    branches:
      - main
    paths:
      - core/runner_five_layer_memory_activation.py
      - tests/test_runner_five_layer_memory_activation.py
      - scripts/runner_poll_github_tasks.py

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 1944 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct/add-memory-activation-runtime-handler-20260725
          fetch-depth: 0
      - name: Register exact polling activation route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/runner_poll_github_tasks.py")
          text = path.read_text(encoding="utf-8")
          if "if task_id == ACTIVATE_FIVE_LAYER_PRIVATE_MEMORY:" in text:
              raise SystemExit(0)

          old_import = """from core.runner_private_memory_source_inventory import (
              CANDIDATE_CATEGORIES as PRIVATE_MEMORY_INVENTORY_CATEGORIES,
              TASK_ID as PRIVATE_MEMORY_PHASE_A_INVENTORY,
              execute_private_memory_phase_a_inventory,
          )
          """.replace("              ", "    ")
          new_import = old_import + """from core.runner_five_layer_memory_activation import (
              TASK_ID as ACTIVATE_FIVE_LAYER_PRIVATE_MEMORY,
              execute_five_layer_memory_activation,
          )
          """.replace("              ", "    ")

          old_allow = "        PRIVATE_MEMORY_HEALTHCHECK,\n        HERMES_PRIVATE_MEMORY_BRIDGE_CHECK,\n"
          new_allow = "        PRIVATE_MEMORY_HEALTHCHECK,\n        ACTIVATE_FIVE_LAYER_PRIVATE_MEMORY,\n        HERMES_PRIVATE_MEMORY_BRIDGE_CHECK,\n"

          old_dispatch = (
              "        if task_id == PRIVATE_MEMORY_HEALTHCHECK:\n"
              "            return private_memory_healthcheck(body)\n"
              "        if task_id == HERMES_PRIVATE_MEMORY_BRIDGE_CHECK:\n"
          )
          new_dispatch = (
              "        if task_id == PRIVATE_MEMORY_HEALTHCHECK:\n"
              "            return private_memory_healthcheck(body)\n"
              "        if task_id == ACTIVATE_FIVE_LAYER_PRIVATE_MEMORY:\n"
              "            return execute_five_layer_memory_activation(\n"
              "                body,\n"
              "                workdir=workdir,\n"
              "                maintenance_report=_maintenance_report,\n"
              "            )\n"
              "        if task_id == HERMES_PRIVATE_MEMORY_BRIDGE_CHECK:\n"
          )

          counts = {
              "import": text.count(old_import),
              "allow": text.count(old_allow),
              "dispatch": text.count(old_dispatch),
          }
          Path("patch-counts.json").write_text(__import__("json").dumps(counts, sort_keys=True))
          if counts != {"import": 1, "allow": 1, "dispatch": 1}:
              raise SystemExit(f"anchor counts={counts}")

          text = text.replace(old_import, new_import)
          text = text.replace(old_allow, new_allow)
          text = text.replace(old_dispatch, new_dispatch)
          path.write_text(text, encoding="utf-8")
          PY
          if git diff --quiet -- scripts/runner_poll_github_tasks.py; then
            exit 0
          fi
          test "$(git diff --name-only)" = "scripts/runner_poll_github_tasks.py"
          git diff --check
          python3 -m py_compile \
            scripts/runner_poll_github_tasks.py \
            core/runner_five_layer_memory_activation.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/runner_poll_github_tasks.py
          git commit -m "Register polling five-layer memory activation route"
          git push origin HEAD:direct/add-memory-activation-runtime-handler-20260725
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-memory-route-patch-${{ github.run_id }}
          path: patch-counts.json
          if-no-files-found: ignore
          retention-days: 1
