name: Temporary Protected Runner Memory Route Patch

"on":
  pull_request:
    branches:
      - main
    paths:
      - core/runner_five_layer_memory_activation.py
      - tests/test_runner_five_layer_memory_activation.py
      - scripts/runner_poll_github_tasks.py

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 1944 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct/add-memory-activation-runtime-handler-20260725
          fetch-depth: 0
      - name: Register exact polling activation route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/runner_poll_github_tasks.py")
          text = path.read_text(encoding="utf-8")
          if "if task_id == ACTIVATE_FIVE_LAYER_PRIVATE_MEMORY:" in text:
              raise SystemExit(0)

          import_anchor = '''from core.runner_private_memory_source_inventory import (
              CANDIDATE_CATEGORIES as PRIVATE_MEMORY_INVENTORY_CATEGORIES,
              TASK_ID as PRIVATE_MEMORY_PHASE_A_INVENTORY,
              execute_private_memory_phase_a_inventory,
          )
          '''.replace("              ", "    ")
          import_block = import_anchor + '''from core.runner_five_layer_memory_activation import (
              TASK_ID as ACTIVATE_FIVE_LAYER_PRIVATE_MEMORY,
              execute_five_layer_memory_activation,
          )
          '''.replace("              ", "    ")
          if text.count(import_anchor) != 1:
              raise SystemExit(f"import anchor count={text.count(import_anchor)}")
          text = text.replace(import_anchor, import_block)

          allow_anchor = '''        PRIVATE_MEMORY_HEALTHCHECK,
              HERMES_PRIVATE_MEMORY_BRIDGE_CHECK,
          '''.replace("              ", "        ")
          allow_block = '''        PRIVATE_MEMORY_HEALTHCHECK,
              ACTIVATE_FIVE_LAYER_PRIVATE_MEMORY,
              HERMES_PRIVATE_MEMORY_BRIDGE_CHECK,
          '''.replace("              ", "        ")
          if text.count(allow_anchor) != 1:
              raise SystemExit(f"allow anchor count={text.count(allow_anchor)}")
          text = text.replace(allow_anchor, allow_block)

          dispatch_anchor = '''        if task_id == PRIVATE_MEMORY_HEALTHCHECK:
              return private_memory_healthcheck(body)
              if task_id == HERMES_PRIVATE_MEMORY_BRIDGE_CHECK:
          '''.replace("              ", "            ")
          dispatch_block = '''        if task_id == PRIVATE_MEMORY_HEALTHCHECK:
              return private_memory_healthcheck(body)
              if task_id == ACTIVATE_FIVE_LAYER_PRIVATE_MEMORY:
                  return execute_five_layer_memory_activation(
                      body,
                      workdir=workdir,
                      maintenance_report=_maintenance_report,
                  )
              if task_id == HERMES_PRIVATE_MEMORY_BRIDGE_CHECK:
          '''.replace("              ", "            ")
          if text.count(dispatch_anchor) != 1:
              raise SystemExit(f"dispatch anchor count={text.count(dispatch_anchor)}")
          text = text.replace(dispatch_anchor, dispatch_block)
          path.write_text(text, encoding="utf-8")
          PY
          if git diff --quiet -- scripts/runner_poll_github_tasks.py; then
            exit 0
          fi
          test "$(git diff --name-only)" = "scripts/runner_poll_github_tasks.py"
          git diff --check
          python3 -m py_compile \
            scripts/runner_poll_github_tasks.py \
            core/runner_five_layer_memory_activation.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/runner_poll_github_tasks.py
          git commit -m "Register polling five-layer memory activation route"
          git push origin HEAD:direct/add-memory-activation-runtime-handler-20260725
