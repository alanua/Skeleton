name: Scheduler Runtime Launch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scheduler-runtime-launch.yml"
      - "core/scheduler_models.py"
      - "core/scheduler_store.py"
      - "core/scheduler_engine.py"
      - "scripts/scheduler_tick.py"
      - "scripts/install_scheduler_core.sh"
      - "ops/systemd/skeleton-scheduler.service"
      - "ops/systemd/skeleton-scheduler.timer"
      - "schemas/schedule.schema.json"
      - "schemas/scheduler_receipt.schema.json"
      - "tests/test_scheduler_models.py"
      - "tests/test_scheduler_store.py"
      - "tests/test_scheduler_engine.py"
      - "tests/test_scheduler_runtime_launch_workflow.py"
      - "docs/SCHEDULER_CORE.md"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: skeleton-scheduler-runtime-launch
  cancel-in-progress: false

jobs:
  validate-and-launch:
    name: Validate and launch exact main
    if: github.repository == 'alanua/Skeleton' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
      - x64
      - hetzner-agent-runner-1
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      INSTALL_RECEIPT: ${{ runner.temp }}/scheduler-install-receipt.json
      VERIFY_RECEIPT: ${{ runner.temp }}/scheduler-verify-receipt.json
      SMOKE_RECEIPT: ${{ runner.temp }}/scheduler-smoke-receipt.json
    steps:
      - name: Checkout exact source
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          clean: true

      - name: Verify exact main identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "alanua/Skeleton"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          checkout_ref="$(git rev-parse --abbrev-ref HEAD)"
          test "${checkout_ref}" = "HEAD" || test "${checkout_ref}" = "main"
          origin="$(git remote get-url origin)"
          test "${origin}" = "https://github.com/alanua/Skeleton" || \
            test "${origin}" = "https://github.com/alanua/Skeleton.git"

      - name: Validate Scheduler suite
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            tests/test_scheduler_models.py \
            tests/test_scheduler_store.py \
            tests/test_scheduler_engine.py \
            tests/test_scheduler_runtime_launch_workflow.py
          python3 -m py_compile \
            core/scheduler_models.py \
            core/scheduler_store.py \
            core/scheduler_engine.py \
            scripts/scheduler_tick.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path("schemas/schedule.schema.json"),
              Path("schemas/scheduler_receipt.schema.json"),
          ):
              json.loads(path.read_text(encoding="utf-8"))
          PY
          bash -n scripts/install_scheduler_core.sh

      - name: Restore clean exact checkout
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${GITHUB_SHA}"
          git clean -fdx
          test -z "$(git status --porcelain)"

      - name: Install and activate Scheduler Core
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env \
            SKELETON_SCHEDULER_INSTALL_ROOT=/opt/skeleton-scheduler \
            SKELETON_SCHEDULER_STATE_ROOT=/var/lib/skeleton/scheduler \
            SKELETON_SCHEDULER_USER=agent \
            SKELETON_SCHEDULER_GROUP=agent \
            bash scripts/install_scheduler_core.sh "${GITHUB_WORKSPACE}" \
            > "${INSTALL_RECEIPT}"
          python3 - "${INSTALL_RECEIPT}" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          allowed = {
              "schema", "status", "schedules", "enabled", "pending", "running",
              "done", "failed", "needs_operator", "skipped", "public_safe",
              "private_payloads_included",
          }
          if set(payload) - allowed:
              raise SystemExit("unexpected installer receipt field")
          if payload.get("status") != "READY" or payload.get("public_safe") is not True:
              raise SystemExit("scheduler status blocked")
          if payload.get("private_payloads_included") is not False:
              raise SystemExit("private payload boundary failed")
          PY

      - name: Verify active singular timer
        id: verify
        if: steps.install.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(sudo -n systemctl is-enabled skeleton-scheduler.timer)" = "enabled"
          test "$(sudo -n systemctl is-active skeleton-scheduler.timer)" = "active"
          test "$(sudo -n systemctl list-timers skeleton-scheduler.timer --all --no-legend | sed '/^[[:space:]]*$/d' | wc -l)" -eq 1
          sudo -n systemctl start skeleton-scheduler.service
          test "$(sudo -n systemctl show skeleton-scheduler.service --property=Result --value)" = "success"
          live_status="$(sudo -n -u agent /usr/bin/python3 \
            /opt/skeleton-scheduler/scripts/scheduler_tick.py \
            --db /var/lib/skeleton/scheduler/scheduler.sqlite3 status)"
          python3 - "${live_status}" "${VERIFY_RECEIPT}" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(sys.argv[1])
          if payload.get("status") != "READY" or payload.get("public_safe") is not True:
              raise SystemExit("live scheduler status blocked")
          receipt = {
              "timer_enabled": True,
              "timer_active": True,
              "timer_count": 1,
              "service_result": "success",
              "live_status": "READY",
          }
          pathlib.Path(sys.argv[2]).write_text(
              json.dumps(receipt, sort_keys=True), encoding="utf-8"
          )
          PY

      - name: Run isolated idempotency smoke
        id: smoke
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d "${RUNNER_TEMP}/scheduler-smoke.XXXXXX")"
          trap 'rm -rf "${smoke_root}"' EXIT
          now="$(date +%s)"
          cat > "${smoke_root}/schedule.json" <<JSON
          {
            "schema": "skeleton.schedule.v1",
            "schedule_id": "synthetic.launch.smoke",
            "trigger_kind": "once",
            "cron_expression": null,
            "once_at": ${now},
            "timezone": "UTC",
            "route_type": "notify",
            "route_id": "synthetic.launch.notice",
            "approval_policy": "notify_only",
            "overlap_policy": "skip",
            "misfire_policy": "run_once",
            "payload": {"synthetic": true}
          }
          JSON
          cli=/opt/skeleton-scheduler/scripts/scheduler_tick.py
          db="${smoke_root}/scheduler.sqlite3"
          /usr/bin/python3 "${cli}" --db "${db}" register \
            "${smoke_root}/schedule.json" --now "$((now - 60))" >/dev/null
          first="$(/usr/bin/python3 "${cli}" --db "${db}" tick --now "${now}")"
          second="$(/usr/bin/python3 "${cli}" --db "${db}" tick --now "${now}")"
          status="$(/usr/bin/python3 "${cli}" --db "${db}" status \
            --schedule-id synthetic.launch.smoke)"
          python3 - "${first}" "${second}" "${status}" "${SMOKE_RECEIPT}" <<'PY'
          import json
          import pathlib
          import sys

          first, second, status = (json.loads(value) for value in sys.argv[1:4])
          if first.get("created_occurrences") != 1 or first.get("states", {}).get("done") != 1:
              raise SystemExit("first occurrence smoke failed")
          if second.get("created_occurrences") != 0:
              raise SystemExit("duplicate occurrence created")
          if status.get("schedule_occurrences") != 1:
              raise SystemExit("occurrence ledger count failed")
          receipt = {
              "first_created": 1,
              "first_done": 1,
              "second_created": 0,
              "occurrence_count": 1,
              "synthetic_state_removed": True,
          }
          pathlib.Path(sys.argv[4]).write_text(
              json.dumps(receipt, sort_keys=True), encoding="utf-8"
          )
          PY

      - name: Publish aggregate launch receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          outcomes = {
              "checkout": os.environ.get("CHECKOUT_OUTCOME", "unknown"),
              "identity": os.environ.get("IDENTITY_OUTCOME", "unknown"),
              "validate": os.environ.get("VALIDATE_OUTCOME", "unknown"),
              "restore": os.environ.get("RESTORE_OUTCOME", "unknown"),
              "install": os.environ.get("INSTALL_OUTCOME", "unknown"),
              "verify": os.environ.get("VERIFY_OUTCOME", "unknown"),
              "smoke": os.environ.get("SMOKE_OUTCOME", "unknown"),
          }
          reasons = [
              f"WORKFLOW_{name.upper()}_FAILED"
              for name, value in outcomes.items()
              if value not in {"success", "skipped"}
          ]

          def load(path_name):
              path = pathlib.Path(os.environ[path_name])
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  return {}
              return payload if isinstance(payload, dict) else {}

          verify = load("VERIFY_RECEIPT")
          smoke = load("SMOKE_RECEIPT")

          def exact_bool(payload, field, expected=True):
              return payload.get(field) is expected

          def exact_int(payload, field, expected):
              value = payload.get(field)
              return isinstance(value, int) and not isinstance(value, bool) and value == expected

          success = (
              all(outcomes[name] == "success" for name in outcomes)
              and exact_bool(verify, "timer_enabled")
              and exact_bool(verify, "timer_active")
              and exact_int(verify, "timer_count", 1)
              and verify.get("live_status") == "READY"
              and exact_int(smoke, "first_created", 1)
              and exact_int(smoke, "second_created", 0)
              and exact_int(smoke, "occurrence_count", 1)
              and exact_bool(smoke, "synthetic_state_removed")
          )
          public = {
              "status": "DONE" if success else "BLOCKED",
              "source_merge_sha": os.environ["GITHUB_SHA"],
              "workflow_outcomes": outcomes,
              "timer_enabled": exact_bool(verify, "timer_enabled"),
              "timer_active": exact_bool(verify, "timer_active"),
              "timer_count": verify.get("timer_count") if exact_int(verify, "timer_count", 1) else 0,
              "service_result": verify.get("service_result", "unknown"),
              "live_status": verify.get("live_status", "unknown"),
              "smoke_first_created": smoke.get("first_created") if exact_int(smoke, "first_created", 1) else 0,
              "smoke_second_created": smoke.get("second_created") if exact_int(smoke, "second_created", 0) else -1,
              "smoke_occurrence_count": smoke.get("occurrence_count") if exact_int(smoke, "occurrence_count", 1) else 0,
              "synthetic_state_removed": exact_bool(smoke, "synthetic_state_removed"),
              "stable_reason_codes": sorted(set(reasons)),
              "public_safe": True,
          }
          body = "Scheduler Core runtime launch receipt.\n\n```json\n" + json.dumps(public, sort_keys=True) + "\n```"
          request = urllib.request.Request(
              "https://api.github.com/repos/alanua/Skeleton/issues/2051/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 201:
                  raise SystemExit("launch receipt publication failed")
          print(json.dumps(public, sort_keys=True))
          PY

      - name: Fail workflow when launch did not complete
        if: steps.install.outcome != 'success' || steps.verify.outcome != 'success' || steps.smoke.outcome != 'success'
        shell: bash
        run: exit 1
