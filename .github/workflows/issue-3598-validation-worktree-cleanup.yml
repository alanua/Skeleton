name: issue-3598-cleanup-and-test-hygiene
on:
  push:
    branches: [bootstrap/3601-validation-worktree-cleanup]
permissions:
  contents: read
  issues: write
jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: clean-exact-stale-validation-tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$HOME/agent-dev/repos/Skeleton"
          EXPECTED="a7e4a94a187de8064601449bc30dda8faec34be7"
          [ "$(git -C "$REPO" rev-parse HEAD)" = "$EXPECTED" ]
          [ -z "$(git -C "$REPO" status --porcelain)" ]
          TARGET=$(cd "$REPO" && python3 -c "from scripts import runner_poll_github_tasks as r; print(r._validation_worktree_path('alanua/Skeleton',3601))")
          EXPECTED_TARGET="$HOME/agent-dev/worktrees/skeleton/validate-pr-branch/pr-3601"
          [ "$TARGET" = "$EXPECTED_TARGET" ]
          [ ! -L "$TARGET" ]
          if git -C "$REPO" worktree list --porcelain | grep -Fqx "worktree $TARGET"; then
            echo 'unexpected_registered_validation_worktree' >&2
            exit 20
          fi
          if [ -e "$TARGET" ]; then
            find "$TARGET" -type d -exec chmod u+rwx {} +
            rm -rf --one-file-system "$TARGET"
          fi
          git -C "$REPO" worktree prune >/dev/null 2>&1 || true
          [ ! -e "$TARGET" ]
          ! git -C "$REPO" worktree list --porcelain | grep -Fqx "worktree $TARGET"
          printf '%s\n' 'DONE: exact stale #3598 validation tree cleared' 'permission_change_scope=pytest_owned_stale_validation_directories_only' 'repository_source_mutation=none' 'service_mutation=none' 'private_path_exposed=false' 'secrets_exposed=false' > /tmp/issue-3598-clean.txt
          gh issue comment 3598 --repo alanua/Skeleton --body-file /tmp/issue-3598-clean.txt
          rm -f /tmp/issue-3598-clean.txt
      - name: checkout-hygiene-fix
        uses: actions/checkout@v4
        with:
          ref: fix/pytest-esp-lab-temp-permissions
          path: hygiene-fix
      - name: validate-hygiene-fix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/hygiene-fix"
          python3 -m pytest -q tests/test_install_home_edge_esp_lab.py | tee /tmp/issue-3598-focused.txt
          python3 -m pytest -q | tee /tmp/issue-3598-full.txt
          git diff --check
          [ -z "$(git status --porcelain)" ]
          FOCUSED=$(tail -n 1 /tmp/issue-3598-focused.txt | tr -cd '[:print:]')
          FULL=$(tail -n 1 /tmp/issue-3598-full.txt | tr -cd '[:print:]')
          printf '%s\n' 'DONE: pytest temp-permission hygiene candidate validated' 'candidate_head=360c37aa227a9053afe3a8b1003b92276348a689' "focused=$FOCUSED" "full=$FULL" 'git_diff_check=pass' 'worktree_clean=true' 'runtime_mutation=none' 'secrets_exposed=false' > /tmp/issue-3598-tests.txt
          gh issue comment 3598 --repo alanua/Skeleton --body-file /tmp/issue-3598-tests.txt
          rm -f /tmp/issue-3598-focused.txt /tmp/issue-3598-full.txt /tmp/issue-3598-tests.txt
