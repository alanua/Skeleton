name: issue-3598-validation-artifact-localization
on:
  push:
    branches: [bootstrap/3601-validation-worktree-cleanup]
permissions:
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: localize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$HOME/agent-dev/repos/Skeleton"
          EXPECTED="a7e4a94a187de8064601449bc30dda8faec34be7"
          [ "$(git -C "$REPO" rev-parse HEAD)" = "$EXPECTED" ]
          [ -z "$(git -C "$REPO" status --porcelain)" ]
          cd "$REPO"
          MATCHES=$(grep -R -n -E 'first_install_canary_fail|canary_failure_restores_p0|esp-lab|install-root' tests core scripts 2>/dev/null | head -80 | sed "s#^$REPO/##" || true)
          TARGET=$(python3 -c "from scripts import runner_poll_github_tasks as r; print(r._validation_worktree_path('alanua/Skeleton',3601))")
          DENIED_COUNT=0
          ROOT_OWNED_COUNT=0
          if [ -d "$TARGET" ]; then
            DENIED_COUNT=$(find "$TARGET" -name ffffffffffffffffffffffffffffffffffffffff -print 2>/dev/null | wc -l)
            ROOT_OWNED_COUNT=$(find "$TARGET" -name ffffffffffffffffffffffffffffffffffffffff -uid 0 -print 2>/dev/null | wc -l)
          fi
          {
            echo 'DIAGNOSTIC: #3598 root-owned validation artifact localization'
            echo "expected_main_sha=$EXPECTED"
            echo "target_pr=3601"
            echo "denied_marker_count=$DENIED_COUNT"
            echo "root_owned_marker_count=$ROOT_OWNED_COUNT"
            echo 'repository_matches:'
            printf '%s\n' "$MATCHES"
            echo 'private_path_exposed=false'
            echo 'secrets_exposed=false'
            echo 'mutation=none'
          } > /tmp/issue-3598-diag.txt
          gh issue comment 3598 --repo alanua/Skeleton --body-file /tmp/issue-3598-diag.txt
          rm -f /tmp/issue-3598-diag.txt
