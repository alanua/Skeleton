# one-shot bounded bootstrap for issue #3598
name: Issue 3598 Validation Worktree Cleanup

on:
  push:
    branches:
      - bootstrap/3601-validation-worktree-cleanup

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Clean exact stale validation worktree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$HOME/agent-dev/repos/Skeleton"
          EXPECTED_MAIN="a7e4a94a187de8064601449bc30dda8faec34be7"
          ISSUE=3598
          PR=3601
          status="BLOCKED"
          reason="preflight_failed"
          remove_code="not_run"
          registered_before="unknown"
          registered_after="unknown"
          exists_before="unknown"
          exists_after="unknown"

          if [[ ! -d "$REPO/.git" ]]; then
            reason="canonical_checkout_missing"
          elif [[ "$(git -C "$REPO" rev-parse HEAD 2>/dev/null || true)" != "$EXPECTED_MAIN" ]]; then
            reason="canonical_head_mismatch"
          elif [[ -n "$(git -C "$REPO" status --porcelain 2>/dev/null || true)" ]]; then
            reason="canonical_checkout_dirty"
          else
            TARGET="$(cd "$REPO" && python3 - <<'PY'
from scripts import runner_poll_github_tasks as r
print(r._validation_worktree_path('alanua/Skeleton', 3601))
PY
)"
            case "$TARGET" in
              "$HOME"/agent-dev/worktrees/skeleton/validate-pr-branch/pr-3601) ;;
              *) reason="derived_target_outside_exact_bound"; TARGET="" ;;
            esac
            if [[ -n "${TARGET:-}" ]]; then
              [[ -e "$TARGET" ]] && exists_before=true || exists_before=false
              if git -C "$REPO" worktree list --porcelain | grep -Fqx "worktree $TARGET"; then
                registered_before=true
              else
                registered_before=false
              fi

              set +e
              git -C "$REPO" worktree remove --force "$TARGET" >/dev/null 2>&1
              remove_code=$?
              set -e
              git -C "$REPO" worktree prune >/dev/null 2>&1 || true

              [[ -e "$TARGET" ]] && exists_after=true || exists_after=false
              if git -C "$REPO" worktree list --porcelain | grep -Fqx "worktree $TARGET"; then
                registered_after=true
              else
                registered_after=false
              fi

              if [[ "$exists_after" == false && "$registered_after" == false ]]; then
                status="DONE"
                reason="stale_validation_worktree_cleared"
              else
                reason="bounded_worktree_remove_failed"
              fi
            fi
          fi

          body=$(cat <<EOF
          ${status}: bounded #3598 validation-worktree cleanup receipt
          expected_main_sha=${EXPECTED_MAIN}
          target_pr=${PR}
          exists_before=${exists_before}
          registered_before=${registered_before}
          worktree_remove_exit_code=${remove_code}
          exists_after=${exists_after}
          registered_after=${registered_after}
          reason=${reason}
          repository_source_mutation=none
          service_mutation=none
          permission_widening=none
          private_path_exposed=false
          secrets_exposed=false
          EOF
          )
          gh issue comment "$ISSUE" --repo alanua/Skeleton --body "$body"
          [[ "$status" == DONE ]]
