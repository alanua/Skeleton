name: Temporary Protected Runner Activation Validation

"on":
  pull_request:
    branches:
      - main
    paths:
      - core/runner_five_layer_memory_activation.py
      - scripts/runner_poll_github_tasks.py
      - tests/test_runner_five_layer_memory_activation.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'pytest>=8.0.0' \
            'PyYAML>=6.0.0' \
            'jsonschema>=4.22.0,<5.0.0' \
            'fastapi==0.116.1' \
            'jinja2==3.1.6' \
            'uvicorn==0.35.0' \
            'httpx==0.28.1' \
            'numpy==2.4.6' \
            'ezdxf==1.4.4' \
            'shapely==2.1.2' \
            'networkx==3.6.1' \
            'pillow==12.2.0' \
            'pdfplumber' \
            'pypdf' \
            'opencv-python-headless' \
            'scikit-image'
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
      - name: Run focused protected Runner tests
        shell: bash
        run: |
          set -o pipefail
          env \
            -u SKELETON_RUNNER_MEMORY_DIR \
            -u SKELETON_RUNNER_MEMORY_DB \
            -u SKELETON_RUNNER_MEMORY_LEDGER \
            python -m pytest -q \
              tests/test_runner_five_layer_memory_activation.py \
              tests/test_runner_poll_github_tasks.py 2>&1 | tee focused.log
      - name: Run full repository tests
        shell: bash
        run: |
          set -o pipefail
          env \
            -u SKELETON_RUNNER_MEMORY_DIR \
            -u SKELETON_RUNNER_MEMORY_DB \
            -u SKELETON_RUNNER_MEMORY_LEDGER \
            python -m pytest -q 2>&1 | tee full.log
      - name: Compile and diff-check
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            core/runner_five_layer_memory_activation.py \
            scripts/runner_poll_github_tasks.py
          git diff --check
      - name: Upload private validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-memory-activation-validation-${{ github.run_id }}
          path: |
            focused.log
            full.log
          if-no-files-found: ignore
          retention-days: 1
