name: Temporary Memory PR Validation

"on":
  pull_request:
    branches:
      - main
    paths:
      - core/cognee_local_runtime.py
      - core/cognee_projection_adapter.py
      - core/cognee_projection_outbox.py
      - core/semantic_memory_projection.py
      - schemas/semantic_memory_recall_response.schema.json
      - scripts/activate_five_layer_private_memory.py
      - tests/test_cognee_local_runtime.py
      - tests/test_cognee_projection_outbox.py
      - .github/workflows/activate-five-layer-private-memory.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install source-validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'pytest>=8.0.0' \
            'PyYAML>=6.0.0' \
            'jsonschema>=4.22.0,<5.0.0' \
            'fastapi==0.116.1' \
            'jinja2==3.1.6' \
            'uvicorn==0.35.0' \
            'httpx==0.28.1' \
            'numpy==2.4.6' \
            'ezdxf==1.4.4' \
            'shapely==2.1.2' \
            'networkx==3.6.1' \
            'pillow==12.2.0' \
            'pdfplumber' \
            'pypdf' \
            'opencv-python-headless' \
            'scikit-image'
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
      - name: Run focused memory tests
        shell: bash
        run: |
          set -o pipefail
          env \
            -u SKELETON_RUNNER_MEMORY_DIR \
            -u SKELETON_RUNNER_MEMORY_DB \
            -u SKELETON_RUNNER_MEMORY_LEDGER \
            python -m pytest -q \
              tests/test_cognee_projection_adapter.py \
              tests/test_cognee_local_runtime.py \
              tests/test_cognee_projection_outbox.py \
              tests/test_memory_bootstrap.py 2>&1 | tee focused.log
      - name: Run full repository tests
        shell: bash
        run: |
          set -o pipefail
          env \
            -u SKELETON_RUNNER_MEMORY_DIR \
            -u SKELETON_RUNNER_MEMORY_DB \
            -u SKELETON_RUNNER_MEMORY_LEDGER \
            python -m pytest -q 2>&1 | tee full.log
      - name: Compile and diff-check
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            core/cognee_local_runtime.py \
            core/cognee_projection_adapter.py \
            core/cognee_projection_outbox.py \
            core/semantic_memory_projection.py \
            scripts/activate_five_layer_private_memory.py
          git diff --check
      - name: Upload private validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-pr-validation-${{ github.run_id }}
          path: |
            focused.log
            full.log
          if-no-files-found: ignore
          retention-days: 1
