name: Temporary 2832 Branch Patcher

"on":
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: temporary-2832-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch-branch:
    if: >-
      github.repository == 'alanua/Skeleton' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'runner/validation-secret-isolation-github-v2' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'alanua'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runner/validation-secret-isolation-github-v2
          fetch-depth: 0
      - name: Apply exact validation secret-isolation patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "89843be0c8e67e3a048fd473bdf293b464da7590"
          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path('scripts/runner_poll_github_tasks.py')
          source = runner_path.read_text(encoding='utf-8')
          old = '''def _validation_command_environment(
              environment: Mapping[str, str] | None = None,
          ) -> dict[str, str]:
              source = os.environ if environment is None else environment
              return sanitize_codegen_child_environment(source)
          '''
          new = '''def _validation_command_environment(
              environment: Mapping[str, str] | None = None,
          ) -> dict[str, str]:
              source = os.environ if environment is None else environment
              return sanitize_codegen_child_environment(
                  source,
                  authority_environment={},
              )
          '''
          if source.count(old) != 1:
              raise SystemExit('runner_patch_preimage_mismatch')
          runner_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_runner_poll_github_tasks.py')
          tests = test_path.read_text(encoding='utf-8')
          test_name = 'test_validation_command_environment_does_not_bind_codegen_fallback_authority'
          if test_name not in tests:
              test = r'''

          def test_validation_command_environment_does_not_bind_codegen_fallback_authority() -> None:
              source = {
                  "PATH": "/usr/bin",
                  "SAFE_SETTING": "kept",
                  "SKELETON_OPENROUTER_FALLBACK_API_KEY": "synthetic-fallback-key",
                  "SKELETON_OPENROUTER_FALLBACK_MODEL": "openrouter/synthetic/model",
                  "SKELETON_OPENHANDS_OPENROUTER_REQUIRED": "1",
                  "OPENROUTER_API_KEY": "synthetic-openrouter-key",
                  "BWS_ACCESS_TOKEN": "synthetic-bws-token",
                  "CREDENTIALS_DIRECTORY": "/synthetic/credentials",
                  "LLM_API_KEY": "synthetic-llm-key",
                  "LLM_MODEL": "synthetic/model",
                  "LLM_BASE_URL": "https://invalid.example",
                  "MAX_BUDGET_PER_TASK": "999",
                  "MAX_ITERATIONS": "999",
                  "LLM_NUM_RETRIES": "99",
              }

              sanitized = runner._validation_command_environment(source)

              assert sanitized == {"PATH": "/usr/bin", "SAFE_SETTING": "kept"}
          '''
              test_path.write_text(tests.rstrip() + test.rstrip() + '\n', encoding='utf-8')
          PY
          git checkout origin/main -- .github/workflows/skeleton-runtime-recovery-bootstrap.yml
          expected="$(printf '%s\n' scripts/runner_poll_github_tasks.py tests/test_runner_poll_github_tasks.py | sort)"
          actual="$(git diff --name-only | sort)"
          test "${actual}" = "${expected}"
          python3 -m py_compile scripts/runner_poll_github_tasks.py tests/test_runner_poll_github_tasks.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- scripts/runner_poll_github_tasks.py tests/test_runner_poll_github_tasks.py .github/workflows/skeleton-runtime-recovery-bootstrap.yml
          git commit -m "Isolate validation from codegen secret authority (#2832)"
          git push origin HEAD:runner/validation-secret-isolation-github-v2
