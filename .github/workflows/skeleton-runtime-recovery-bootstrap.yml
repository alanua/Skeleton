name: Temporary Universal SecretStore Validator

"on":
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  validate-and-clean:
    if: >-
      github.repository == 'alanua/Skeleton' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'runner/universal-bitwarden-service-secretstore-v2' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'alanua'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runner/universal-bitwarden-service-secretstore-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair test helper, validate SecretStore, clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "89843be0c8e67e3a048fd473bdf293b464da7590"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_credential_broker.py')
          text = path.read_text(encoding='utf-8')
          old = '''        runtime_contexts=runtime_contexts
                  or {binding.service_id: _runtime_context(binding.service_id) for binding in bindings},
          '''
          new = '''        runtime_contexts=(
                      runtime_contexts
                      if runtime_contexts is not None
                      else {binding.service_id: _runtime_context(binding.service_id) for binding in bindings}
                  ),
          '''
          if text.count(old) != 1:
              raise SystemExit('test_helper_preimage_mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m pip install --quiet 'pytest>=8,<10'
          env \
            -u BWS_ACCESS_TOKEN \
            -u CREDENTIALS_DIRECTORY \
            -u OPENROUTER_API_KEY \
            -u LLM_API_KEY \
            -u LLM_MODEL \
            -u SKELETON_OPENROUTER_FALLBACK_API_KEY \
            -u SKELETON_OPENROUTER_FALLBACK_MODEL \
            -u SKELETON_OPENHANDS_OPENROUTER_REQUIRED \
            python -m pytest -q tests/test_credential_broker.py tests/test_bitwarden_credential_runtime.py
          python -m py_compile \
            core/credential_broker.py \
            core/service_credentials.py \
            adapters/credential_control.py \
            integrations/bitwarden_credential_runtime.py \
            tests/test_credential_broker.py \
            tests/test_bitwarden_credential_runtime.py
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('schemas/service_credential_binding.schema.json').read_text(encoding='utf-8'))
          PY
          git checkout origin/main -- .github/workflows/skeleton-runtime-recovery-bootstrap.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tests/test_credential_broker.py .github/workflows/skeleton-runtime-recovery-bootstrap.yml
          git commit -m "Fix trusted runtime context regression helper"
          git push origin HEAD:runner/universal-bitwarden-service-secretstore-v2
