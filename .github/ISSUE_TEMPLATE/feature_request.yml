name: Feature request
description: Propose a bounded Skeleton capability or workflow improvement
title: "[feature] "
labels: []
body:
  - type: textarea
    id: need
    attributes:
      label: Maintainer / user need
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and where it belongs in Skeleton.
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authority / safety impact
      description: Does this change execution, approvals, credentials, networking, firmware, physical devices, privacy, or durable state?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: How should correctness and real-world postconditions be verified?
