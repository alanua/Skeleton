# Digest slots deliberately fail closed until registry provenance is reviewed.
name: skeleton-steel-probe
x-common: &common
  init: true
  restart: 'no'
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [synthetic]
  labels:
    org.skeleton.lab: web-steel-probe-v1
services:
  steel:
    <<: *common
    image: ghcr.io/steel-dev/steel-browser-api@${STEEL_DIGEST:?review official v0.5.5-beta digest first}
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    shm_size: 256m
    environment:
      DOMAIN: steel:3000
      CDP_DOMAIN: steel:9223
      DEFAULT_TIMEZONE: UTC
      LOG_STORAGE_ENABLED: 'false'
  fixture:
    <<: *common
    image: skeleton-steel-probe-client:local
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        CLIENT_DIGEST: ${CLIENT_DIGEST:?review official Playwright v1.56.0-noble digest first}
    command: [python, fixture_server.py]
    read_only: true
    mem_limit: 128m
    cpus: 0.1
    pids_limit: 16
  client:
    <<: *common
    image: skeleton-steel-probe-client:local
    command: [python, probe.py, client]
    read_only: true
    tmpfs: [/tmp:size=32m]
    mem_limit: 896m
    cpus: 0.4
    pids_limit: 64
    depends_on: [steel, fixture]
networks:
  synthetic:
    internal: true
